# CI gate: mirrors `just gate` (fmt, clippy -D warnings, test, release
# build, the generated skill check) plus a dependency audit.
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # install.sh is executed by users straight off a release asset, so a
  # bashism or an unquoted expansion in it is a shipped defect. Mirrors
  # `just lint-sh`; shellcheck is preinstalled on the runner image.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s sh install.sh scripts/test-install.sh

  clippy:
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      # skills/chictrip-axi/SKILL.md is generated from the command index;
      # this fails when the committed copy no longer matches the CLI.
      - run: cargo run --locked --quiet -- setup skill --check

  # MSRV job: enable once a 1.85 build has been verified (edition 2024
  # sets the floor). Keep the toolchain below in sync with Cargo.toml
  # rust-version.
  #
  # msrv:
  #   needs: fmt
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: dtolnay/rust-toolchain@master
  #       with:
  #         toolchain: "1.85"
  #     - uses: Swatinem/rust-cache@v2
  #     - run: cargo check --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
