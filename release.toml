# cargo-release config: no crates.io publish, no auto-push
# (the release commit and tag stay local; push is a manual step).
publish = false
push = false
tag-name = "v{{version}}"
# Sign tags with the repo's git signing config (SSH key via gpg.format),
# the same one commit.gpgsign already uses for every commit.
sign-tag = true
allow-branch = ["master"]
# release-hook runs the gate, then regenerates CHANGELOG.md via
# git-cliff for the version being prepared (see justfile).
pre-release-hook = ["just", "release-hook"]
